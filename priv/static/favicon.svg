<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0f3a2c" />

  <!-- back ridge -->
  <path d="M0 27 L9 13 L17 27 Z" fill="#1f6f56" />
  <!-- front peak -->
  <path d="M5 27 L18 4 L31 27 Z" fill="#2a9d7c" />
  <!-- snow cap -->
  <path d="M14 11 L18 4 L22 11 L20 9.5 L18 11.5 L16 9.5 Z" fill="#f0fbf5" />

  <!-- tiny hiker with absurd pack -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- pack -->
    <rect x="9" y="13" width="7" height="9" rx="1" fill="#e76f51" />
    <rect x="8" y="11.5" width="9" height="2" rx="1" fill="#f4a261" />
    <!-- head -->
    <circle cx="16" cy="16" r="1.4" fill="#0f0f0f" />
    <!-- body bent forward -->
    <path d="M16 17.2 L18 21" stroke="#0f0f0f" stroke-width="1.4" />
    <!-- legs -->
    <path d="M18 21 L17 25" stroke="#0f0f0f" stroke-width="1.4" />
    <path d="M18 21 L20 24.5" stroke="#0f0f0f" stroke-width="1.4" />
    <!-- pole -->
    <line x1="19" y1="20" x2="22" y2="26" stroke="#0f0f0f" stroke-width="0.7" />
  </g>
</svg>
