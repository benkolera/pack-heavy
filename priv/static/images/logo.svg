<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Packheavy">
  <title>Packheavy</title>

  <!-- back mountain -->
  <path d="M0 58 L18 24 L34 58 Z" fill="#1f6f56" />
  <!-- front mountain -->
  <path d="M8 58 L36 8 L62 58 Z" fill="#2a9d7c" />
  <!-- snow cap on front peak -->
  <path d="M28 22 L36 8 L44 22 L40 19 L36 23 L32 19 Z" fill="#f0fbf5" />

  <!-- hiker climbing up the slope, leaning forward under an absurdly large pack -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- comically large pack: tall body + bedroll on top + side pouch -->
    <rect x="11" y="20" width="16" height="22" rx="2" fill="#e76f51" />
    <rect x="9" y="16" width="20" height="5" rx="2.5" fill="#f4a261" />
    <rect x="26" y="26" width="5" height="10" rx="1.5" fill="#c0563b" />
    <!-- pack lash points -->
    <line x1="13" y1="26" x2="25" y2="26" stroke="#1f1f1f" stroke-width="0.6" />
    <line x1="13" y1="32" x2="25" y2="32" stroke="#1f1f1f" stroke-width="0.6" />
    <line x1="13" y1="38" x2="25" y2="38" stroke="#1f1f1f" stroke-width="0.6" />
    <!-- shoulder strap -->
    <path d="M22 22 Q26 26 27 32" stroke="#1f1f1f" stroke-width="1.2" fill="none" />

    <!-- head -->
    <circle cx="27" cy="29" r="2.4" fill="#1f1f1f" />
    <!-- torso (bent forward by the load) -->
    <path d="M27 31 L31 39" stroke="#1f1f1f" stroke-width="2.4" fill="none" />
    <!-- planted leg, downhill -->
    <path d="M31 39 L28 47 L29 51" stroke="#1f1f1f" stroke-width="2.4" fill="none" />
    <!-- stepping leg, uphill -->
    <path d="M31 39 L36 45 L34 49" stroke="#1f1f1f" stroke-width="2.4" fill="none" />
    <!-- arm + trekking pole -->
    <path d="M28 33 L33 38" stroke="#1f1f1f" stroke-width="1.8" fill="none" />
    <line x1="33" y1="38" x2="37" y2="52" stroke="#1f1f1f" stroke-width="1" />
  </g>
</svg>
