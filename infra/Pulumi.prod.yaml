config:
  aws:region: ap-southeast-2
  packheavy:domain: benkolera.com
  packheavy:subdomain: packheavy
  packheavy:hostedZoneId: Z3C8FISDEC6QOG
  packheavy:imageTag: e2dc685
  packheavy:running: "true"
  packheavy:enableCognito: "true"
  # When enableCognito is flipped to "true", set the following first
  # (the identity stack errors loudly if any are missing):
  #
  #   pulumi config set --secret packheavy:adminEmail        ben.kolera@gmail.com
  #   pulumi config set --secret packheavy:googleClientId    <from console.cloud.google.com>
  #   pulumi config set --secret packheavy:googleClientSecret <from console.cloud.google.com>
  #
  # Order of operations:
  #   1. `pulumi up` once with enableCognito=false to provision ALB/ACM/etc.
  #   2. Flip enableCognito=true, set the three secrets above.
  #   3. `pulumi up` — this provisions Cognito + the hosted-UI domain.
  #   4. `pulumi stack output cognitoDomain` → register that domain's
  #      `/oauth2/idpresponse` URL as the redirect URI in your Google
  #      OAuth client.
  #   5. `pulumi up` again if you needed to update Google client creds.

