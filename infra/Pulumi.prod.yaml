config:
  aws:region: ap-southeast-2
  packheavy:domain: benkolera.com
  packheavy:subdomain: packheavy
  packheavy:hostedZoneId: Z3C8FISDEC6QOG
  packheavy:imageTag: b1dd2bd
  packheavy:running: "true"
  packheavy:enableAuth0: "true"
  # When enableAuth0 is flipped to "true", set the following first
  # (the identity stack errors loudly if any are missing):
  #
  #   pulumi config set --secret packheavy:adminEmail            ben.kolera@gmail.com
  #   pulumi config set --secret packheavy:googleClientId        <from console.cloud.google.com>
  #   pulumi config set --secret packheavy:googleClientSecret    <from console.cloud.google.com>
  #   pulumi config set --secret packheavy:auth0Domain           <tenant>.<region>.auth0.com
  #   pulumi config set --secret packheavy:auth0MgmtClientId     <Auth0 M2M client>
  #   pulumi config set --secret packheavy:auth0MgmtClientSecret <Auth0 M2M client secret>
  #
  # Order of operations:
  #   1. `pulumi up` once with enableAuth0=false to provision ALB/ACM/etc.
  #   2. Sign up at auth0.com (creates the tenant). Create a Machine-to-
  #      Machine application authorised for the Auth0 Management API
  #      with read/create/update/delete on clients, connections,
  #      actions, and triggers. That M2M's domain/client_id/client_secret
  #      become the three auth0 secrets above.
  #   3. Flip enableAuth0=true, set the six secrets above.
  #   4. `pulumi up` — provisions the Auth0 application, the Google
  #      connection, and the post-login allowlist Action.
  #   5. `pulumi stack output auth0GoogleRedirectUri` → register that URL
  #      as the redirect URI in your Google OAuth client.

